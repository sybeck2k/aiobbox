[package]
name = "bbox"
version = "0.3.1"
edition = "2021"
description = "Async Rust API client for Bouygues Telecom routers"
license = "Apache-2.0"
authors = ["Sweenu <contact@sweenu.xyz>"]
keywords = ["bbox", "bouygues", "router", "api", "async"]
categories = ["api-bindings", "network-programming"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
mac_oui = { version = "0.4", features = ["with-db"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
